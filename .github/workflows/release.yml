name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            arch: amd64
          - rid: win-arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.rid }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD)"
          mkdir -p dist/${{ matrix.rid }}
          docker build \
            --target artifact \
            --build-arg TARGETRID=${{ matrix.rid }} \
            --build-arg CONFIG=Release \
            --build-arg GIT_COMMIT="$COMMIT" \
            --output type=local,dest=./dist/${{ matrix.rid }} \
            .

      - name: Stage artifact
        run: cp dist/${{ matrix.rid }}/lhm-exporter.exe dist/lhm-exporter-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lhm-exporter-${{ matrix.arch }}
          path: dist/lhm-exporter-${{ matrix.arch }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: .github/release-body.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
